name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege for every job: CI only reads the repo. Declared here rather
# than per-job so a new job cannot silently inherit a wider repository default.
permissions:
  contents: read

jobs:
  test:
    # Both platforms matter: bullpen-sandbox confines shell commands with
    # Seatbelt on macOS and falls back to the in-process check elsewhere, and
    # bullpen-auth branches on macOS for credential storage. A Linux-only run
    # would not exercise either path.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # persist-credentials: false — no step here does authenticated git work,
      # so leaving the token in .git/config is exposure with no upside.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No toolchain action: rust-toolchain.toml is the single source of the
      # version, so CI and local builds cannot drift. Installing explicitly
      # keeps it a visible step instead of an implicit side effect of cargo.
      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      # No rust-cache: rustfmt parses sources and never builds, so there is
      # nothing to restore and the cache round-trip would cost more than the job.
      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
